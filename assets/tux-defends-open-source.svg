<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Tux defends open source</title>
  <desc id="desc">A custom cartoon Linux penguin wielding a sword beside an open-source emblem, with a shattered Windows logo and playful comic-book impact effects.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101d3b"/>
      <stop offset="1" stop-color="#182b52"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".45" stop-color="#a8d7ff"/>
      <stop offset="1" stop-color="#4a83c4"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dcecff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="760" rx="38" fill="url(#bg)"/>
  <g opacity=".18" stroke="#6fc8ff" stroke-width="2">
    <path d="M45 110H1155M45 150H1155M45 610H1155M45 650H1155"/>
    <path d="M100 45V715M150 45V715M1050 45V715M1100 45V715"/>
  </g>
  <text x="600" y="74" fill="#9fe5ff" font-family="Arial,sans-serif" font-size="27" font-weight="700" letter-spacing="5" text-anchor="middle">FREEDOM TO BUILD • FREEDOM TO SHARE</text>
  <!-- Generic open-source emblem: an open ring and connected community nodes -->
  <g transform="translate(160 205)" filter="url(#glow)">
    <circle cx="0" cy="0" r="73" fill="none" stroke="#63e6a7" stroke-width="20" stroke-dasharray="360 105" stroke-linecap="round" transform="rotate(-35)"/>
    <path d="M-38 -34L-6 -5L34 -39M-6 -5L34 39" fill="none" stroke="#b5ffd9" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-38" cy="-34" r="16" fill="#63e6a7"/><circle cx="34" cy="-39" r="16" fill="#63e6a7"/><circle cx="34" cy="39" r="16" fill="#63e6a7"/><circle cx="-6" cy="-5" r="18" fill="#eafff4"/>
  </g>
  <text x="160" y="320" fill="#9fffc8" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle">OPEN SOURCE</text>
  <text x="160" y="351" fill="#d3fce5" font-family="Arial,sans-serif" font-size="17" text-anchor="middle">SHARE • IMPROVE • REPEAT</text>
  <!-- Windows panes, deliberately shown as broken cartoon shards -->
  <g transform="translate(965 238)">
    <path d="M-92 -76L-14 -88L-22 -12L-96 -8Z" fill="#00a4ef" stroke="#e9f8ff" stroke-width="5"/>
    <path d="M5 -90L88 -102L85 -20L-3 -14Z" fill="#7fba00" stroke="#e9f8ff" stroke-width="5"/>
    <path d="M-100 9L-25 4L-30 79L-105 67Z" fill="#f25022" stroke="#e9f8ff" stroke-width="5"/>
    <path d="M-6 2L84 -4L79 82L-14 77Z" fill="#ffb900" stroke="#e9f8ff" stroke-width="5"/>
    <path d="M-110 -113L-48 -137L-31 -106L-66 -68L-29 -41L-63 -2L-100 -26L-127 -1L-144 -38L-115 -65Z" fill="#ffed9e" stroke="#fff" stroke-width="4"/>
    <path d="M15 -118L35 -151L66 -128L52 -98L97 -79L77 -49L40 -67L20 -39L-1 -65L20 -87Z" fill="#ffed9e" stroke="#fff" stroke-width="4"/>
    <path d="M-123 18L-151 45L-127 67L-143 95L-103 106L-83 77L-51 96L-37 66L-65 41L-52 16Z" fill="#ffed9e" stroke="#fff" stroke-width="4"/>
    <path d="M40 95L62 123L91 105L109 130L137 105L118 75L84 85L66 65Z" fill="#ffed9e" stroke="#fff" stroke-width="4"/>
    <path d="M-150 -165L-132 -133M120 -164L105 -133M-169 131L-140 116M146 28L174 18" stroke="#ffde59" stroke-width="8" stroke-linecap="round"/>
    <path d="M-125 -8L-72 -36L-91 12L-65 39L-101 35Z" fill="#fff" opacity=".9"/>
    <path d="M-6 -14L22 -50L13 -7L45 11L8 24Z" fill="#fff" opacity=".85"/>
  </g>
  <text x="965" y="365" fill="#ffcfb6" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle">WINDOWS: BONKED</text>
  <!-- Tux body -->
  <g transform="translate(575 390)">
    <ellipse cx="0" cy="150" rx="168" ry="24" fill="#071225" opacity=".7"/>
    <path d="M-128 40C-174 -31 -155 -145 -91 -188C-54 -212 52 -212 91 -188C155 -145 174 -31 128 40L102 142L-102 142Z" fill="#111827" stroke="#050a14" stroke-width="10"/>
    <ellipse cx="0" cy="42" rx="101" ry="126" fill="url(#belly)" stroke="#a8bfd8" stroke-width="5"/>
    <path d="M-74 -122C-50 -145 -23 -152 0 -152C25 -152 52 -145 75 -122" fill="none" stroke="#34445b" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="-42" cy="-115" rx="25" ry="34" fill="#fff"/><ellipse cx="42" cy="-115" rx="25" ry="34" fill="#fff"/>
    <ellipse cx="-37" cy="-109" rx="11" ry="18" fill="#111827"/><ellipse cx="47" cy="-109" rx="11" ry="18" fill="#111827"/>
    <path d="M-23 -69L24 -69L0 -42Z" fill="#ffb52e" stroke="#d97a13" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-106 -2C-151 -7 -184 -42 -205 -78" fill="none" stroke="#111827" stroke-width="42" stroke-linecap="round"/>
    <path d="M106 0C148 -26 163 -61 170 -91" fill="none" stroke="#111827" stroke-width="42" stroke-linecap="round"/>
    <path d="M-105 4C-150 4 -176 -25 -194 -54" fill="none" stroke="#ffb52e" stroke-width="24" stroke-linecap="round"/>
    <path d="M106 0C143 -20 154 -50 162 -79" fill="none" stroke="#ffb52e" stroke-width="24" stroke-linecap="round"/>
    <path d="M-83 141L-113 167L-48 175L-24 150Z" fill="#ffb52e" stroke="#d97a13" stroke-width="5" stroke-linejoin="round"/>
    <path d="M30 150L53 174L119 164L86 141Z" fill="#ffb52e" stroke="#d97a13" stroke-width="5" stroke-linejoin="round"/>
  </g>
  <!-- Sword in Tux's raised flipper -->
  <g transform="translate(742 310) rotate(24)">
    <path d="M0 30L-14 -180L0 -218L14 -180Z" fill="url(#steel)" stroke="#e8f7ff" stroke-width="4" stroke-linejoin="round"/>
    <path d="M0 -210L0 26" stroke="#fff" stroke-width="4" opacity=".85"/>
    <path d="M-42 30H42L31 45H-31Z" fill="#d9e7f6" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
    <rect x="-10" y="43" width="20" height="58" rx="7" fill="#9a5b36" stroke="#f0c69a" stroke-width="4"/>
    <path d="M-10 55L10 68M-10 72L10 85" stroke="#f8e5c9" stroke-width="4"/>
    <circle cx="0" cy="110" r="12" fill="#ffcb66" stroke="#fff0c7" stroke-width="4"/>
  </g>
  <g fill="#ffdf69" stroke="#fff3b6" stroke-width="3" stroke-linejoin="round">
    <path d="M790 165L810 118L821 161L858 147L833 182L865 205L821 204L811 246L795 207L757 222L777 189L751 161Z"/>
    <path d="M831 415L846 384L856 413L884 405L865 429L886 449L855 447L847 476L835 448L806 456L823 433L806 414Z"/>
  </g>
  <rect x="270" y="575" width="660" height="104" rx="22" fill="#0b1529" stroke="#5a8cc6" stroke-width="3"/>
  <text x="600" y="621" fill="#fff" font-family="Arial,sans-serif" font-size="37" font-weight="900" text-anchor="middle" letter-spacing="2">TUX DEFENDS OPEN SOURCE</text>
  <text x="600" y="654" fill="#a7d9ff" font-family="Arial,sans-serif" font-size="19" text-anchor="middle">NO PROPRIETARY WINDOWS WERE HARMED IN THIS CARTOON</text>
  <text x="600" y="725" fill="#6d91c1" font-family="Arial,sans-serif" font-size="15" text-anchor="middle">CARSON'S TOTALLY UNNECESSARY OS RIVALRY COLLECTION • VECTOR ART</text>
</svg>