<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
<title id="title">Open source, open minds</title>
<desc id="desc">A friendly custom cartoon Linux penguin mascot beneath the words Open Source, Open Minds, on a deep blue starry background.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102448"/><stop offset="1" stop-color="#07101f"/></linearGradient>
  <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#d7e9ff"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe99b"/><stop offset="1" stop-color="#ffad35"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".4"/></filter>
</defs>
<rect width="1000" height="760" rx="36" fill="url(#sky)"/>
<g fill="#b7e5ff" opacity=".7"><circle cx="96" cy="92" r="3"/><circle cx="171" cy="157" r="2"/><circle cx="854" cy="105" r="3"/><circle cx="910" cy="190" r="2"/><circle cx="790" cy="72" r="2"/><circle cx="108" cy="420" r="2"/><circle cx="880" cy="448" r="3"/><circle cx="188" cy="550" r="2"/><circle cx="820" cy="575" r="2"/></g>
<g filter="url(#shadow)" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900">
  <text x="500" y="135" font-size="70" letter-spacing="3" fill="#9be8ff">OPEN SOURCE,</text>
  <text x="500" y="220" font-size="70" letter-spacing="3" fill="#b6ffcf">OPEN MINDS</text>
</g>
<path d="M270 265H730" stroke="#76c8ff" stroke-width="3" stroke-linecap="round" opacity=".8"/>
<g transform="translate(500 465)" filter="url(#shadow)">
  <!-- body and flippers -->
  <path d="M-126 -18C-190 -37 -219 3 -206 66C-195 117 -159 129 -126 100Z" fill="#151e2d" stroke="#050a12" stroke-width="8"/>
  <path d="M126 -18C190 -37 219 3 206 66C195 117 159 129 126 100Z" fill="#151e2d" stroke="#050a12" stroke-width="8"/>
  <path d="M-126 45C-160 -31 -146 -136 -85 -181C-46 -211 46 -211 85 -181C146 -136 160 -31 126 45L105 153H-105Z" fill="#111a28" stroke="#050a12" stroke-width="9"/>
  <ellipse cx="0" cy="24" rx="95" ry="124" fill="url(#belly)" stroke="#b5cde8" stroke-width="5"/>
  <!-- eyes -->
  <ellipse cx="-40" cy="-116" rx="24" ry="33" fill="#fff"/>
  <ellipse cx="40" cy="-116" rx="24" ry="33" fill="#fff"/>
  <ellipse cx="-35" cy="-111" rx="10" ry="17" fill="#101827"/>
  <ellipse cx="45" cy="-111" rx="10" ry="17" fill="#101827"/>
  <!-- beak -->
  <path d="M-28 -72L28 -72L0 -43Z" fill="url(#gold)" stroke="#d78a1d" stroke-width="4" stroke-linejoin="round"/>
  <!-- feet -->
  <path d="M-87 145L-119 177L-47 181L-22 153Z" fill="url(#gold)" stroke="#d78a1d" stroke-width="5" stroke-linejoin="round"/>
  <path d="M23 153L49 181L120 174L87 145Z" fill="url(#gold)" stroke="#d78a1d" stroke-width="5" stroke-linejoin="round"/>
  <!-- friendly little open book -->
  <g transform="translate(0 68)">
    <path d="M-8 -5C-38 -27 -67 -27 -85 -16V35C-58 24 -29 29 -8 47Z" fill="#65dca3" stroke="#d9ffea" stroke-width="4" stroke-linejoin="round"/>
    <path d="M8 -5C38 -27 67 -27 85 -16V35C58 24 29 29 8 47Z" fill="#7dc7ff" stroke="#e0f4ff" stroke-width="4" stroke-linejoin="round"/>
    <path d="M0 -3V47" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <path d="M-66 -1L-28 8M-66 13L-28 22M28 8L66 -1M28 22L66 13" stroke="#15385b" stroke-width="4" stroke-linecap="round" opacity=".8"/>
  </g>
</g>
<g fill="#ffdf82"><path d="M218 314l8 19 20 8-20 8-8 20-8-20-20-8 20-8z"/><path d="M790 307l7 17 18 7-18 7-7 18-7-18-18-7 18-7z"/><path d="M781 520l6 14 15 6-15 6-6 15-6-15-15-6 15-6z"/></g>
<text x="500" y="700" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" letter-spacing="2" fill="#a9c9ed">LEARN • SHARE • BUILD TOGETHER</text>
</svg>