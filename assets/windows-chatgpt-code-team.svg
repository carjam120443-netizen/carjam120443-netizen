  <!-- Coding lab -->
  <g filter="url(#shadow)">
    <rect x="642" y="44" width="520" height="330" rx="22" fill="#1a2845" stroke="#7fa9d8" stroke-width="3"/>
    <rect x="660" y="63" width="484" height="292" rx="13" fill="url(#screen)"/>
    <rect x="660" y="63" width="484" height="34" rx="13" fill="#31486d"/>
