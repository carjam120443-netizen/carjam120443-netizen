    <path d="M927 478q14 12 28 0" fill="none" stroke="#24324b" stroke-width="4" stroke-linecap="round"/>
    <path d="M917 500v12h44v-12" fill="#f8fffd" stroke="#24324b" stroke-width="4" stroke-linejoin="round"/>
