    <path d="M887 541l-31 34q-13 13-25 1t0-26l32-39" fill="#f2c7a5" class="line"/>
    <path d="M1012 541l33 48q9 14-5 23t-24-4l-43-45" fill="#f2c7a5" class="line"/>
    <rect x="868" y="405" width="143" height="105" rx="18" fill="#f8fffd" stroke="#24324b" stroke-width="5"/>
