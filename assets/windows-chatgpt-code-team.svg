<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Windows 11 and ChatGPT coding together</title>
  <desc id="desc">A friendly Windows 11 character in a fictional cozy bedroom collaborates with a friendly ChatGPT-inspired character in a colorful code environment. Both have expressive faces and casual clothes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dff3ff"/><stop offset="1" stop-color="#e9e5ff"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".86"/><stop offset="1" stop-color="#cce9ff" stop-opacity=".72"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14213f"/><stop offset="1" stop-color="#243c69"/></linearGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2388e8"/><stop offset="1" stop-color="#1552ad"/></linearGradient>
    <linearGradient id="sweater" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#21bda4"/><stop offset="1" stop-color="#087e76"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#38527a" flood-opacity=".18"/></filter>
    <style>
      .line{stroke:#24324b;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .eye{fill:#24324b}
      .code{font-family:Consolas,Monaco,monospace;font-size:17px;font-weight:600}
      .label{font-family:Segoe UI,Arial,sans-serif;font-size:21px;font-weight:700;letter-spacing:.5px;fill:#20304a}
    </style>
  </defs>
