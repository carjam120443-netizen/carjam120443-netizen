    <text x="744" y="86" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#d9eaff">teamwork.js — shared workspace</text>
    <g class="code">
      <text x="684" y="127" fill="#8ea7d2">01</text><text x="718" y="127" fill="#b9d7ff">const</text><text x="771" y="127" fill="#7ee6d0"> teamwork </text><text x="868" y="127" fill="#ffffff">= {</text>
      <text x="684" y="158" fill="#8ea7d2">02</text><text x="718" y="158" fill="#ffcf8a">  humans: </text><text x="814" y="158" fill="#b6f0a5">"ideas"</text><text x="877" y="158" fill="#ffffff">,</text>
      <text x="684" y="189" fill="#8ea7d2">03</text><text x="718" y="189" fill="#ffcf8a">  ai: </text><text x="770" y="189" fill="#b6f0a5">"helpful hints"</text><text x="905" y="189" fill="#ffffff">,</text>
      <text x="684" y="220" fill="#8ea7d2">04</text><text x="718" y="220" fill="#ffcf8a">  result: </text><text x="803" y="220" fill="#b6f0a5">"working code!"</text>
      <text x="684" y="251" fill="#8ea7d2">05</text><text x="718" y="251" fill="#ffffff">};</text>
      <text x="684" y="296" fill="#7ee6d0">✓ build passed</text><text x="870" y="296" fill="#b6f0a5">  0 errors</text>
    </g>
  </g>
