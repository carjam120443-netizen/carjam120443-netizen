<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Carson coding with ChatGPT</title>
  <desc id="desc">A cozy fictional bedroom and computer setup. Carson, shown as a privacy-preserving cartoon with a blue Windows-logo head, codes at the desk while a friendly glowing AI orb floats nearby with code panels.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9eaff"/><stop offset=".55" stop-color="#c6dcfa"/><stop offset="1" stop-color="#e9ddff"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b4c9e5"/><stop offset="1" stop-color="#829fc5"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101d36"/><stop offset="1" stop-color="#1c3a62"/></linearGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#248ff0"/><stop offset="1" stop-color="#1554b5"/></linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset=".5" stop-color="#d8fff8"/><stop offset="1" stop-color="#75dcca"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".94"/><stop offset="1" stop-color="#d9efff" stop-opacity=".82"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#263d65" flood-opacity=".22"/></filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="13" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .outline{stroke:#263955;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}
      .code{font-family:Consolas,Monaco,monospace;font-size:17px;font-weight:600}
      .sans{font-family:'Segoe UI',Arial,sans-serif}
    </style>
  </defs>
  <!-- One connected, fictional bedroom scene -->
  <rect width="1200" height="720" rx="30" fill="url(#wall)"/>
  <path d="M0 562L1200 520V720H0Z" fill="url(#floor)"/>
  <path d="M0 560L1200 518" stroke="#e9f4ff" stroke-width="7" opacity=".8"/>
  <!-- window and night sky -->
  <g filter="url(#shadow)">
    <rect x="56" y="50" width="250" height="220" rx="15" fill="#f8fbff" stroke="#8eb2dc" stroke-width="5"/>
    <rect x="71" y="65" width="220" height="190" rx="8" fill="#213c70"/>
    <circle cx="242" cy="99" r="20" fill="#ffe9a5"/>
    <circle cx="251" cy="91" r="20" fill="#213c70"/>
    <g fill="#fff" opacity=".9"><circle cx="111" cy="100" r="3"/><circle cx="173" cy="135" r="3"/><circle cx="119" cy="176" r="2.5"/><circle cx="267" cy="192" r="2.5"/><circle cx="202" cy="78" r="2"/></g>
    <path d="M71 218l49-51 42 36 31-42 98 68v26H71Z" fill="#527aa8"/>
    <path d="M180 65v190M71 160h220" stroke="#eaf5ff" stroke-width="8"/>
  </g>
  <!-- wall decor -->
  <g filter="url(#shadow)">
    <rect x="351" y="63" width="150" height="111" rx="10" fill="#fff" stroke="#9ab8dd" stroke-width="4"/>
    <rect x="364" y="76" width="124" height="85" rx="5" fill="#e7f4ff"/>
    <path d="M385 133l24-35 20 24 15-16 24 27" fill="none" stroke="#64a4db" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="426" y="153" text-anchor="middle" class="sans" font-size="11" font-weight="700" fill="#54769e">BUILD • TEST • REPEAT</text>
    <rect x="532" y="64" width="100" height="110" rx="9" fill="#c6d8ef" stroke="#9ab8dd" stroke-width="4"/>
    <path d="M552 91h59M552 108h46M552 125h55M552 142h36" stroke="#7798bf" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- bed tucked in the background -->
  <g filter="url(#shadow)">
    <rect x="70" y="380" width="245" height="105" rx="18" fill="#6c8fbe"/>
    <rect x="82" y="365" width="222" height="83" rx="18" fill="#eef5ff"/>
    <rect x="91" y="374" width="86" height="54" rx="12" fill="#b8d8f8"/>
    <path d="M180 398q52-22 113 5v44H180Z" fill="#d8e8fb"/>
    <path d="M75 470h235v27H75Z" fill="#45658f"/>
    <path d="M95 497v30M293 497v30" stroke="#45658f" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- desk -->
  <g filter="url(#shadow)">
    <path d="M265 483H1045L1018 518H288Z" fill="#b9825f" class="outline"/>
    <path d="M309 516v143M1000 516v143" stroke="#77533f" stroke-width="17" stroke-linecap="round"/>
    <path d="M292 659h43M982 659h43" stroke="#77533f" stroke-width="11" stroke-linecap="round"/>
    <rect x="490" y="337" width="306" height="147" rx="13" fill="#263852" stroke="#17273e" stroke-width="5"/>
    <rect x="504" y="351" width="278" height="119" rx="5" fill="url(#screen)"/>
    <rect x="504" y="351" width="278" height="20" rx="5" fill="#30496b"/>
    <circle cx="518" cy="361" r="3.5" fill="#ff8d94"/><circle cx="530" cy="361" r="3.5" fill="#ffd37b"/><circle cx="542" cy="361" r="3.5" fill="#7de5b0"/>
    <text x="558" y="365" class="sans" font-size="9" fill="#d9eaff">carsonOS / main.cpp</text>
    <g class="code">
      <text x="520" y="393" fill="#8ca8d2">01</text><text x="548" y="393" fill="#80e6d5">const</text><text x="600" y="393" fill="#ffffff"> build = () =&gt; {</text>
      <text x="520" y="415" fill="#8ca8d2">02</text><text x="548" y="415" fill="#ffd08c">  ideas.push</text><text x="655" y="415" fill="#b8f0a7">("Carson")</text>
      <text x="520" y="437" fill="#8ca8d2">03</text><text x="548" y="437" fill="#ffd08c">  debug</text><text x="608" y="437" fill="#ffffff">();</text>
      <text x="520" y="459" fill="#8ca8d2">04</text><text x="548" y="459" fill="#80e6d5">  return</text><text x="613" y="459" fill="#b8f0a7"> "it works!"</text>
    </g>
    <path d="M626 484v25h38v-25" fill="#526d90" stroke="#263852" stroke-width="4"/>
    <path d="M590 509h110l20 9H570Z" fill="#d6e4f6" stroke="#263852" stroke-width="4" stroke-linejoin="round"/>
    <!-- keyboard -->
    <path d="M429 493h153l22 25H410Z" fill="#dce8f7" stroke="#5e789b" stroke-width="4" stroke-linejoin="round"/>
    <g stroke="#9ab0cd" stroke-width="3"><path d="M438 501h132M431 509h145M451 496l-8 17M472 496l-5 17M493 496v17M514 496l5 17M535 496l9 17M556 496l12 17"/></g>
    <!-- mouse -->
    <path d="M742 494q24-7 34 12t-19 22q-22-4-15-34Z" fill="#e7f0fb" stroke="#5e789b" stroke-width="4"/>
    <path d="M758 496v10" stroke="#9ab0cd" stroke-width="3"/>
    <!-- mug and plant -->
    <path d="M350 441h57v50q-28 18-57 0Z" fill="#f7fbff" stroke="#526b8d" stroke-width="4"/>
    <path d="M407 451q30-3 16 23h-16" fill="none" stroke="#526b8d" stroke-width="5"/>
    <path d="M378 439q-15-16 0-25q15 9 0 25" fill="#8dcbef"/>
    <rect x="915" y="433" width="66" height="58" rx="8" fill="#e7b69b" stroke="#8d604e" stroke-width="4"/>
    <path d="M948 434q-32-37-45-4q27 0 45 18q7-44 38-37q-1 27-38 43q17-40 2-55q-18 14-2 35" fill="#4eaa86" stroke="#31816a" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <!-- Carson at the PC: logo head is intentional privacy protection -->
  <g filter="url(#shadow)">
    <!-- chair -->
    <path d="M357 476q0-65 65-65h30q42 0 42 48v100H357Z" fill="#496f9f" stroke="#263955" stroke-width="5"/>
    <path d="M421 558v83M389 641h67" stroke="#263955" stroke-width="12" stroke-linecap="round"/>
    <!-- torso / hoodie -->
    <path d="M373 413q7-45 53-48l29 4q47 7 51 51l-9 61H378Z" fill="url(#hoodie)" class="outline"/>
    <path d="M414 374l25 25 24-25" fill="none" stroke="#a8d9ff" stroke-width="6" stroke-linecap="round"/>
    <!-- arms reaching keyboard -->
    <path d="M385 419l-32 45q-8 13 5 21q13 7 22-6l35-42" fill="#e9b995" class="outline"/>
    <path d="M493 420l25 44q8 14-5 21q-13 7-21-6l-29-42" fill="#e9b995" class="outline"/>
    <!-- privacy-preserving Windows head -->
    <rect x="393" y="284" width="116" height="94" rx="15" fill="#f7fbff" stroke="#263955" stroke-width="5"/>
    <path d="M405 297h42v31h-42Z" fill="#26a5f5"/><path d="M455 297h42v31h-42Z" fill="#0878d1"/>
    <path d="M405 335h42v31h-42Z" fill="#0878d1"/><path d="M455 335h42v31h-42Z" fill="#26a5f5"/>
    <path d="M432 319h-10M482 319h-10" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".9"/>
    <path d="M435 347q16 11 32 0" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- floating ChatGPT helper: an orb, not a strange humanoid -->
  <g filter="url(#glow)">
    <circle cx="902" cy="252" r="88" fill="#79e5d4" opacity=".22"/>
    <circle cx="902" cy="252" r="65" fill="url(#orb)" stroke="#ffffff" stroke-width="5"/>
    <circle cx="902" cy="252" r="55" fill="none" stroke="#8bcfc4" stroke-width="2" opacity=".8"/>
    <!-- simple original interwoven assistant mark -->
    <g fill="none" stroke="#137f78" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M889 219q-17-8-24 9l-4 13q-4 14 10 19l14 5q13 4 18-10l5-13q5-13-9-19"/>
      <path d="M915 219q17-8 24 9l4 13q4 14-10 19l-14 5q-13 4-18-10l-5-13q-5-13 9-19"/>
      <path d="M889 219l26 0M885 265l30 0"/>
    </g>
  </g>
  <!-- translucent floating code windows -->
  <g filter="url(#shadow)">
    <rect x="757" y="104" width="195" height="87" rx="13" fill="url(#glass)" stroke="#fff" stroke-width="3"/>
    <rect x="757" y="104" width="195" height="20" rx="10" fill="#d5ebff"/>
    <circle cx="771" cy="114" r="3" fill="#f48c9a"/><circle cx="782" cy="114" r="3" fill="#f5c86f"/><circle cx="793" cy="114" r="3" fill="#69cfa5"/>
    <path d="M775 141h45M775 155h86M775 169h64" stroke="#2f7eaf" stroke-width="5" stroke-linecap="round"/>
    <path d="M986 226h119q12 0 12 12v114q0 12-12 12H986q-12 0-12-12V238q0-12 12-12Z" fill="url(#glass)" stroke="#fff" stroke-width="3"/>
    <rect x="974" y="226" width="143" height="21" rx="10" fill="#c5f3eb"/>
    <text x="990" y="241" class="sans" font-size="11" font-weight="700" fill="#2b6d6b">AI CODE SUGGESTIONS</text>
    <g class="code" font-size="13">
      <text x="989" y="269" fill="#168c7d">if</text><text x="1007" y="269" fill="#344a68">(bug) {</text>
      <text x="989" y="291" fill="#344a68">  debug();</text>
      <text x="989" y="313" fill="#168c7d">  return</text><text x="1062" y="313" fill="#9b69c6"> "fixed";</text>
      <text x="989" y="335" fill="#344a68">}</text>
    </g>
  </g>
  <!-- connecting sparkle trails -->
  <path d="M817 272q-48 14-63 53M963 280q17 11 20 28" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 11"/>
  <g fill="#fff"><path d="M704 255l6 15 15 6-15 6-6 15-6-15-15-6 15-6Z"/><path d="M1050 167l4 10 10 4-10 4-4 10-4-10-10-4 10-4Z"/></g>
  <!-- names -->
  <g filter="url(#shadow)">
    <rect x="353" y="580" width="157" height="43" rx="21" fill="#eaf6ff" stroke="#fff" stroke-width="3"/>
    <text x="431" y="608" text-anchor="middle" class="sans" font-size="23" font-weight="800" fill="#1d4d88">CARSON</text>
    <rect x="828" y="382" width="148" height="36" rx="18" fill="#e5fff8" stroke="#fff" stroke-width="3"/>
    <text x="902" y="406" text-anchor="middle" class="sans" font-size="18" font-weight="800" fill="#176f69">CHATGPT</text>
  </g>
  <rect x="30" y="673" width="1140" height="28" rx="14" fill="#ffffff" fill-opacity=".42"/>
  <text x="600" y="693" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#385778">CARSON BUILDS AT THE PC  •  CHATGPT FLOATS IN WITH CODE  •  TEAMWORK ✨</text>
</svg>