      <stop offset="0" stop-color="#10182e"/>
      <stop offset="1" stop-color="#263c63"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#72c9ff"/>
      <stop offset="1" stop-color="#1760bd"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity=".4"/>
    </filter>
  </defs>
  <rect width="520" height="320" rx="24" fill="url(#bg)"/>
