    <path d="M70 221 L52 240 L91 240 L99 225 M133 225 L144 240 L183 240 L158 219" fill="#ffb13b" stroke="#e68a1e" stroke-width="3" stroke-linejoin="round"/>
    <path d="M184 90 L195 77 L193 94 L209 89 L198 103" fill="none" stroke="#ffce72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
