<svg xmlns="http://www.w3.org/2000/svg" width="520" height="320" viewBox="0 0 520 320" role="img" aria-labelledby="title desc">
  <title id="title">We Hate Defender</title>
  <desc id="desc">A cartoon penguin gives a dramatic thumbs down to a nervous blue security shield, with a harmless Linux detected alert.</desc>
  <defs>
