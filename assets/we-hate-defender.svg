  <text x="260" y="276" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="900" fill="#fff" text-anchor="middle">WE HATE DEFENDER</text>
  <text x="260" y="299" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#a9d8ff" text-anchor="middle">just a penguin and a very dramatic thumbs-down</text>
